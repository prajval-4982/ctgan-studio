<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribution Comparison — CTGAN Studio</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@300;400;500&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #09090B; --bg-card: #0F1015; --bg-panel: #14151C; --bg-3: #1A1B25;
    --border: rgba(255,255,255,0.07); --border-md: rgba(255,255,255,0.12); --border-hi: rgba(255,255,255,0.2);
    --accent: #60A5FA; --accent2: #34D399;
    --text-1: #F2F2F5; --text-2: #9496A1; --text-3: #52545F;
    --mono: 'Geist Mono', monospace; --serif: 'Instrument Serif', serif; --sans: 'Geist', sans-serif;
  }
  body { background: var(--bg); color: var(--text-1); font-family: var(--sans); min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 56px 56px; pointer-events: none; z-index: 0;
  }

  nav { position: sticky; top: 0; z-index: 100; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; background: rgba(9,9,11,0.82); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
  .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .nav-brand img { height: 28px; width: auto; border-radius: 5px; }
  .nav-name { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--text-1); }
  .nav-links { display: flex; align-items: center; gap: 24px; list-style: none; }
  .nav-links a { font-family: var(--mono); font-size: 11px; color: var(--text-3); text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase; transition: color 0.15s; }
  .nav-links a:hover, .nav-links a.active { color: var(--text-1); }

  .container { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 48px 32px 80px; }

  .sec-tag { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-3); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .sec-tag::before { content: '//'; color: var(--border-md); }

  h1 { font-family: var(--serif); font-size: clamp(28px, 4vw, 42px); font-weight: 400; letter-spacing: -0.02em; margin-bottom: 24px; text-align: center; }
  h1 em { font-style: italic; color: var(--text-2); }

  .plots-grid { display: grid; grid-template-columns: 1fr; gap: 40px; }
  .plot-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; padding: 32px; }
  .plot-card img { width: 100%; display: block; border-radius: 6px; }
  .plot-card canvas { width: 100% !important; max-height: 800px; }

  .back-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background: transparent; color: var(--text-2); font-family: var(--mono); font-size: 12px; border-radius: 6px; text-decoration: none; border: 1px solid var(--border-md); margin-bottom: 32px; transition: all 0.15s; }
  .back-btn:hover { border-color: var(--border-hi); color: var(--text-1); }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 3px; }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">
    <img src="{{ url_for('static', filename='favicon.png') }}" alt="Logo">
    <span class="nav-name">CTGAN Studio</span>
  </a>
  <ul class="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/upload">Upload</a></li>
    <li><a href="/generate">Generate</a></li>
    <li><a href="/results">Results</a></li>
  </ul>
</nav>

<div class="container">
  <a href="/results" class="back-btn">← Back to Results</a>
  <div class="sec-tag">Full-Screen View</div>
  <h1>Distribution <em>comparison</em></h1>
  
  <div class="plots-grid">
    {% if hist_data %}
      {% for col_name in hist_data.keys() %}
      <div class="plot-card">
         <canvas id="histChart_{{ loop.index }}"></canvas>
      </div>
      {% endfor %}
    {% endif %}
    {% for pf in plot_files %}
      {% if 'correlation' in pf %}
      <div class="plot-card"><img src="{{ url_for('static', filename='plots/' + pf) }}" alt="{{ pf }}"></div>
      {% endif %}
    {% endfor %}
  </div>
</div>

<script id="hist-data-raw" type="application/json">{{ hist_data | tojson | safe if hist_data else '{}' }}</script>

<script>
  Chart.defaults.font.family = "'Geist', system-ui, sans-serif";
  Chart.defaults.color = '#9496A1';

  const rawHist = document.getElementById('hist-data-raw').textContent.trim() 
                  ? JSON.parse(document.getElementById('hist-data-raw').textContent) : {};
  
  Object.keys(rawHist).forEach((col, i) => {
    const ctx = document.getElementById('histChart_' + (i + 1));
    if (!ctx) return;
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: rawHist[col].labels,
        datasets: [
          { label: 'Real', data: rawHist[col].real_counts, backgroundColor: 'rgba(96,165,250,0.8)', borderColor: 'rgba(96,165,250,1)', borderWidth: 1, barPercentage: 0.85, categoryPercentage: 0.7 },
          { label: 'Synthetic', data: rawHist[col].synth_counts, backgroundColor: 'rgba(52,211,153,0.7)', borderColor: 'rgba(52,211,153,1)', borderWidth: 1, barPercentage: 0.85, categoryPercentage: 0.7 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { title: { display: true, text: col, font: { size: 18, weight: '600' }, color: '#F2F2F5' } }
      }
    });
  });
</script>
</body>
</html>
